<title>FitText test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<body style="background:#0a0a0a;color:#ddd;font-family:sans-serif;margin:0;padding:16px">
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect } = React;
function FitText(props) {
    const { children, className, wrap = true, align = "center" } = props;
    const boxRef = useRef(null);
    const textRef = useRef(null);
    const [size, setSize] = useState(0);
    const fit = useCallback(() => {
        const box = boxRef.current, text = textRef.current;
        if (!box || !text)
            return;
        const W = box.clientWidth, H = box.clientHeight;
        if (!W || !H)
            return;
        let lo = 1, hi = Math.max(2, H), best = 1;
        for (let i = 0; i < 14; i++) {
            const mid = (lo + hi) / 2;
            text.style.fontSize = mid + "px";
            if (text.scrollWidth <= W - 1 && text.offsetHeight <= H - 1) {
                best = mid;
                lo = mid;
            }
            else
                hi = mid;
        }
        best = Math.floor(best * 4) / 4;
        text.style.fontSize = best + "px";
        setSize(best);
    }, []);
    useLayoutEffect(fit);
    useEffect(() => {
        const box = boxRef.current;
        if (!box || typeof ResizeObserver === "undefined")
            return;
        const ro = new ResizeObserver(() => fit());
        ro.observe(box);
        return () => ro.disconnect();
    }, [fit]);
    const justify = align === "start" ? "justify-start" : align === "end" ? "justify-end" : "justify-center";
    return (React.createElement("div", { ref: boxRef, className: "relative h-full w-full min-w-0 min-h-0 overflow-hidden flex items-center " + justify + " " + (className || "") },
        React.createElement("span", { ref: textRef, style: {
                fontSize: size ? size + "px" : undefined,
                lineHeight: 1.1,
                display: "inline-block",
                whiteSpace: wrap ? "normal" : "nowrap",
                maxWidth: wrap ? "calc(100% - 2px)" : undefined,
                wordBreak: "keep-all",
                overflowWrap: "normal",
                textAlign: align === "start" ? "left" : align === "end" ? "right" : "center",
            } }, children)));
}

const h = React.createElement;
const CASES = [["128.00", false], ["-03:42", false], ["HEADPHONE CUE", false], ["HEADPHONE CUE", true],
  ["One More Time — Daft Punk (Extended Mix)", true], ["8", false]];
const SLOTS = [[72, 72], [240, 240], [320, 64], [64, 240]];
function Cell({ w, hh, text, wrap, scale }) {
  return h("div", { style: { width: w, height: hh, outline: "1px dashed #555", borderRadius: 8, overflow: "visible", transform: scale ? "scale(" + scale + ")" : undefined, transformOrigin: "top left" } },
    h("div", { style: { position: "relative", width: "100%", height: "100%" } }, h("div", { style: { position: "absolute", inset: "12%" } },
      h(FitText, { wrap, className: "font-mono font-bold text-amber-300" }, text))));
}
function App() {
  return h("div", null, CASES.map(([t, wrap], i) => h("div", { key: i, style: { marginBottom: 18 } },
    h("div", { style: { font: "11px monospace", color: "#fbbf24", marginBottom: 4 } }, JSON.stringify(t) + (wrap ? " (wrap)" : "")),
    h("div", { style: { display: "flex", gap: 14, alignItems: "flex-start" } },
      SLOTS.map(([w, hh], j) => h(Cell, { key: j, w, hh, text: t, wrap })),
      h("div", { style: { width: 120, height: 120 } }, h(Cell, { w: 240, hh: 240, text: t, wrap, scale: 0.5 }))))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
