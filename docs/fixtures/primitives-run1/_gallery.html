      h("div", { className: "contract" }, JSON.stringify(t.props)),
      (SAMPLES[t.type]?.vars || [{}]).map((v, vi) => h("div", { className: "row", key: vi },
        h("div", { className: "vlabel" }, Object.keys(v).length ? JSON.stringify(v, (k, x) => Array.isArray(x) ? "[" + x.length + " items]" : x) : "base"),
        SLOTS.map(([name, w, hgt]) => h("div", { className: "cell", key: name },
          h("div", { className: "slot", style: { width: w * scale, height: hgt * scale } },
            h(Boundary, null, h(Harness, { type: t.type, init: { ...SAMPLES[t.type].base, ...v } }))),
          h("div", { className: "cap" }, name + " " + Math.round(w * scale) + "×" + Math.round(hgt * scale)))))))),
    h("div", { className: "log" }, msg));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
